
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Citas Veterinarias</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="contenedor">
        <a class="volver" href="index.html">Volver al inicio</a>
        <h1>Consultorio Veterinario</h1>
        <p class="descripcion">Sistema de registro de citas médicas</p>
        <form id="formulario">
            <div class="campo">
                <label>Fecha de la cita:</label>
                <input type="date" id="fecha">
            </div>
            <div class="campo">
                <label>Nombre de la mascota:</label>
                <input type="text" id="nombre" placeholder="Ingrese el nombre">
            </div>
            <div class="campo">
                <label>Tipo de mascota:</label>
                <select id="tipoMascota">
                    <option value="">Seleccione una opción</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Conejo">Conejo</option>
                </select>
            </div>
            <div class="campo">
                <label>Raza de la mascota:</label>
                <input type="text" id="raza" placeholder="Ingrese la raza">
            </div>
            <div class="campo">
                <label>Edad de la mascota:</label>
                <input type="number" id="edad" placeholder="Ingrese la edad" min="0" step="1">
            </div>
            <div class="campo">
                <label>Tipo de consulta:</label>
                <select id="tipoConsulta">
                    <option value="">Seleccione una opción</option>
                    <option value="Cita">Cita</option>
                    <option value="Baño y estética">Baño y estética</option>
                    <option value="Vacunación">Vacunación</option>
                    <option value="Urgencia">Urgencia</option>
                </select>
            </div>
            <button type="submit">Registrar cita</button>
        </form>
        <p id="mensaje"></p>
        <h2>Citas registradas</h2>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Mascota</th>
                        <th>Tipo</th>
                        <th>Raza</th>
                        <th>Edad</th>
                        <th>Consulta</th>
                    </tr>
                </thead>
                <tbody id="tablaCitas">
                </tbody>
            </table>
        </div>
    </div>
    <script src="js/ejercicio4.js"></script>
</body>
</html>
